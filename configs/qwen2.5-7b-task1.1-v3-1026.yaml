model:
  name_or_path: models/7b/Qwen2.5-7B-Instruct
  trust_remote_code: false
  use_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

data:
  train_file: data-finetune-v3-task1.1/task_1_1_v3_train.jsonl
  max_seq_length: 2048
  num_proc: 4
  packing: false
  default_system_prompt: >-
    Bạn trích xuất thực thể pháp lý tiếng Việt từ một đoạn văn.

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

training:
  output_dir: checkpoints/7b/task1.1-v3-1026
  final_adapter_dir: adapters/7b/qwen2.5-7b-task1.1-v3-1026
  num_train_epochs: 3
  learning_rate: 0.0002
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 0.3
  logging_steps: 10
  save_steps: 50
  save_total_limit: 2
  seed: 42
  bf16: true
  tf32: true
  report_to: none
